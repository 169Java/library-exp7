<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('读者注册')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('')}"></header>

<div class="auth-wrap">
    <div class="auth-card wide">
        <div class="auth-head">
            <span class="brand-mark">注</span>
            <h1>读者注册</h1>
            <p>注册成功后即可登录借阅馆藏图书</p>
        </div>

        <form id="register-form" autocomplete="off">
            <div class="form-row">
                <div class="form-item">
                    <label for="username">账号</label>
                    <input type="text" id="username" placeholder="4-20 位字母、数字或下划线" required>
                </div>
                <div class="form-item">
                    <label for="name">姓名</label>
                    <input type="text" id="name" placeholder="请输入真实姓名" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="至少 6 位" required>
                </div>
                <div class="form-item">
                    <label for="confirm">确认密码</label>
                    <input type="password" id="confirm" placeholder="再次输入密码" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label for="phone">手机号（选填）</label>
                    <input type="text" id="phone" placeholder="11 位手机号">
                </div>
                <div class="form-item">
                    <label for="email">邮箱（选填）</label>
                    <input type="email" id="email" placeholder="example@mail.com">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btn-register">提交注册</button>
        </form>

        <div class="auth-foot">
            已有账号？<a th:href="@{/login}">返回登录</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/register.js}"></script>
</body>
</html>
