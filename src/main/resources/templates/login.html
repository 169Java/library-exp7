<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('')}"></header>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <span class="brand-mark">书</span>
            <h1>登录智慧图书馆</h1>
            <p>管理员与读者共用登录入口，系统自动识别角色</p>
        </div>

        <form id="login-form" autocomplete="off">
            <div class="form-item">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" placeholder="请输入管理员或读者账号" required>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入登录密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="btn-login">登 录</button>
        </form>

        <div class="auth-foot">
            还没有账号？<a th:href="@{/register}">立即注册读者账号</a>
        </div>

        <div class="demo-box">
            <b>演示账号</b><br>
            管理员：admin / admin123<br>
            读者：zhangsan / 123456（李四 lisi / 123456，王五已被禁用）
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
